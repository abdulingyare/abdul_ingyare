<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abdul Ingyare</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      text-align: center;
      min-height: 100vh;
      padding: 60px 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .profile {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .username {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .bio {
      font-size: 18px;
      line-height: 1.6;
      color: #ddd;
      margin-bottom: 35px;
    }

    .links a {
      display: block;
      text-decoration: none;
      color: white;
      border: 1px solid #444;
      padding: 16px;
      margin: 14px 0;
      border-radius: 12px;
      font-size: 18px;
      transition: 0.3s;
    }

    .links a:hover {
      background: white;
      color: black;
    }

    footer {
      margin-top: 50px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <img class="profile" src="https://via.placeholder.com/140" alt="Abdul Ingyare">

    <h1>Abdul Ingyare</h1>

    <div class="username">@abdul_ingyare</div>

    <p class="bio">
      Tech Creator • TikTok Expert • Digital Content Creator
      <br>
      Welcome to my official website.
    </p>

    <div class="links">
      <a href="https://www.tiktok.com/@abdul_ingyare">TikTok</a>
      <a href="https://www.instagram.com/abdul_ingyare">Instagram</a>
    </div>

    <footer>
      © 2026 Abdul Ingyare. All rights reserved.
    </footer>

  </div>

</body>
</html>
